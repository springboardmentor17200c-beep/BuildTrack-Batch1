<div class="bt-page">

  <button class="bt-back-btn" (click)="goBack()">
    ← Back
  </button>

  <div class="bt-topbar">
    <div>
      <h1 class="bt-title">Maintenance Scheduling</h1>
      <p class="bt-subtitle">
        Schedule and monitor preventive and corrective maintenance.
      </p>
    </div>
  </div>

  <div class="toolbar">

    <input
      type="text"
      placeholder="Search equipment..."
      [(ngModel)]="searchText">

    <select [(ngModel)]="selectedType">
      <option>All</option>
      <option>Preventive</option>
      <option>Corrective</option>
    </select>

    <button
      class="add-btn"
      (click)="scheduleMaintenance()">
      + Schedule Maintenance
    </button>

  </div>

  <table>

    <thead>
      <tr>
        <th>Equipment</th>
        <th>Type</th>
        <th>Maintenance Date</th>
        <th>Next Due</th>
        <th>Cost</th>
        <th>Serviced By</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let r of filteredRecords">

        <td>{{ r.resource }}</td>
        <td>{{ r.type }}</td>
        <td>{{ r.maintenanceDate }}</td>
        <td>{{ r.nextDate }}</td>
        <td>₹ {{ r.cost }}</td>
        <td>{{ r.servicedBy }}</td>

        <td>
          <span
            class="status"
            [class.upcoming]="r.status === 'Upcoming'"
            [class.completed]="r.status === 'Completed'">
            {{ r.status }}
          </span>
        </td>

      </tr>

    </tbody>

  </table>

</div>

<!-- Schedule Maintenance Modal -->

<div
  class="modal-overlay"
  *ngIf="showModal">

  <div class="modal">

    <div class="modal-header">

      <h2>Schedule Maintenance</h2>

      <button
        class="close-btn"
        (click)="closeModal()">
        ✕
      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Equipment</label>

        <select>
          <option>Excavator EX-01</option>
          <option>Tower Crane TC-02</option>
          <option>Concrete Mixer CM-01</option>
        </select>
      </div>

      <div class="form-group">
        <label>Maintenance Type</label>

        <select>
          <option>Preventive</option>
          <option>Corrective</option>
        </select>
      </div>

      <div class="form-group">
        <label>Maintenance Date</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>Next Maintenance Date</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>Cost</label>
        <input
          type="number"
          placeholder="Enter maintenance cost">
      </div>

      <div class="form-group">
        <label>Serviced By</label>
        <input
          type="text"
          placeholder="Technician / Company">
      </div>

      <div class="form-group">
        <label>Remarks</label>
        <textarea rows="3"></textarea>
      </div>

    </div>

    <div class="modal-footer">

      <button
        class="cancel-btn"
        (click)="closeModal()">
        Cancel
      </button>

      <button class="save-btn">
        Save
      </button>

    </div>

  </div>

</div>
