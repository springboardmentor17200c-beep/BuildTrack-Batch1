<div class="bt-page">
  <button class="bt-back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
    Back
  </button>

  <div class="bt-topbar">
    <div>
      <h1 class="bt-title">Resource Management</h1>
      <p class="bt-subtitle">
        Allocate, track and analyze machinery &amp; equipment across all your sites.
      </p>
    </div>
  </div>

  <div class="bt-option-grid">
    <button
      class="bt-option-card"
      *ngFor="let opt of options"
      (click)="open(opt.route)"
      [routerLink]="['/resources', opt.route]">

      <div class="bt-stat-icon" [ngClass]="opt.accent" style="width:44px;height:44px;">

        <!-- Resource Allocation -->
        <svg *ngIf="opt.icon === 'allocation'" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="7" height="16" rx="1.5"></rect>
          <rect x="14" y="4" width="7" height="8" rx="1.5"></rect>
          <path d="M14 16h7"></path>
          <path d="M17.5 12.5v7"></path>
        </svg>

        <!-- Equipment Tracking -->
        <svg *ngIf="opt.icon === 'tracking'" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 3"></path>
        </svg>

        <!-- Resource Utilization -->
        <svg *ngIf="opt.icon === 'dashboard'" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"></path>
          <rect x="7" y="12" width="3" height="6"></rect>
          <rect x="12" y="8" width="3" height="10"></rect>
          <rect x="17" y="5" width="3" height="13"></rect>
        </svg>

        <!-- Maintenance Scheduling -->
        <svg *ngIf="opt.icon === 'maintenance'" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
                   1.65 1.65 0 0 0-1 1.51V21
                   a2 2 0 1 1-4 0v-.09
                   a1.65 1.65 0 0 0-1-1.51
                   1.65 1.65 0 0 0-1.82.33l-.06.06
                   a2 2 0 1 1-2.83-2.83l.06-.06
                   a1.65 1.65 0 0 0 .33-1.82
                   1.65 1.65 0 0 0-1.51-1H3
                   a2 2 0 1 1 0-4h.09
                   a1.65 1.65 0 0 0 1.51-1
                   1.65 1.65 0 0 0-.33-1.82l-.06-.06
                   a2 2 0 1 1 2.83-2.83l.06.06
                   a1.65 1.65 0 0 0 1.82.33H9
                   a1.65 1.65 0 0 0 1-1.51V3
                   a2 2 0 1 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51
                   1.65 1.65 0 0 0 1.82-.33l.06-.06
                   a2 2 0 1 1 2.83 2.83l-.06.06
                   a1.65 1.65 0 0 0-.33 1.82V9
                   a1.65 1.65 0 0 0 1.51 1H21
                   a2 2 0 1 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>

      </div>

      <div class="bt-option-body">
        <h3>{{ opt.title }}</h3>
        <p>{{ opt.description }}</p>
      </div>

      <div class="bt-option-footer">
        <div class="bt-stat-text">
          <span class="bt-stat-value" style="font-size:16px;">{{ opt.stat }}</span>
          <span class="bt-stat-sub">{{ opt.statLabel }}</span>
        </div>

        <span class="bt-option-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </div>

    </button>
  </div>

  <div class="bt-panel">
    <div class="bt-panel-header">
      <div>
        <h3 class="bt-panel-title">Fleet Overview</h3>
        <span class="bt-panel-sub">Current status across all tracked equipment</span>
      </div>
    </div>

    <div class="bt-stats-row" style="margin-bottom:0;">

      <div class="bt-stat-card">
        <div class="bt-stat-icon blue">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </div>
        <div class="bt-stat-text">
          <span class="bt-stat-value">{{ totalAssets }}</span>
          <span class="bt-stat-label">Total Assets</span>
        </div>
      </div>

      <div class="bt-stat-card">
        <div class="bt-stat-icon green">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </div>
        <div class="bt-stat-text">
          <span class="bt-stat-value">{{ inUseCount }}</span>
          <span class="bt-stat-label">In Use</span>
        </div>
      </div>

      <div class="bt-stat-card">
        <div class="bt-stat-icon purple">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </div>
        <div class="bt-stat-text">
          <span class="bt-stat-value">{{ availableCount }}</span>
          <span class="bt-stat-label">Available</span>
        </div>
      </div>

      <div class="bt-stat-card">
        <div class="bt-stat-icon orange">
          <svg width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2">
            <path d="M12 8v4l3 2"></path>
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </div>
        <div class="bt-stat-text">
          <span class="bt-stat-value">{{ maintenanceCount }}</span>
          <span class="bt-stat-label">Under Maintenance</span>
        </div>
      </div>

    </div>
  </div>
</div>
