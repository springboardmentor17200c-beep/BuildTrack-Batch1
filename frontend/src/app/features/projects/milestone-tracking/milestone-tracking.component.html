<div class="bt-shell">
  <app-sidebar></app-sidebar>
  <div class="bt-main">
    <div class="bt-page">
      <button class="bt-back-btn" (click)="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>

      <div class="bt-topbar">
        <div>
          <h1 class="bt-title">Milestone Tracking</h1>
          <p class="bt-subtitle">Key checkpoints across all projects.</p>
        </div>
        <div class="bt-actions">
          <button class="bt-add-btn" (click)="toggleForm()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            <span *ngIf="!showForm">New Milestone</span>
            <span *ngIf="showForm">Cancel</span>
          </button>
        </div>
      </div>

      <form class="bt-form-card" *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()">
        <div class="bt-form-grid">
          <label>
            <span>Project</span>
            <select formControlName="projectId">
              <option value="" disabled selected>Select project</option>
              <option *ngFor="let p of projects" [value]="p.projectId">{{ p.projectName }}</option>
            </select>
          </label>
          <label>
            <span>Milestone Name</span>
            <input type="text" formControlName="milestoneName" placeholder="e.g. Roofing Complete" />
          </label>
          <label>
            <span>Due Date</span>
            <input type="date" formControlName="dueDate" />
          </label>
        </div>
        <label class="bt-auth-field" style="margin-top:16px;">
          <span>Description</span>
          <input type="text" formControlName="description" placeholder="What needs to be finished for this milestone" />
        </label>
        <div class="bt-form-actions">
          <button type="submit" class="bt-add-btn">Add Milestone</button>
        </div>
      </form>

      <div class="bt-actions" style="margin-bottom:20px;">
        <select class="bt-filter-select" [(ngModel)]="projectFilter" [ngModelOptions]="{standalone: true}">
          <option value="All">All Projects</option>
          <option *ngFor="let p of projects" [value]="p.projectId">{{ p.projectName }}</option>
        </select>
        <select class="bt-filter-select" [(ngModel)]="statusFilter" [ngModelOptions]="{standalone: true}">
          <option *ngFor="let s of statuses" [value]="s">{{ s === 'All' ? 'All Statuses' : s }}</option>
        </select>
      </div>

      <div class="bt-panel">
        <div class="bt-panel-header">
          <div>
            <h3 class="bt-panel-title">All Milestones</h3>
            <span class="bt-panel-sub">{{ filtered.length }} of {{ allMilestones.length }}</span>
          </div>
        </div>
        <div class="bt-table-wrap">
          <table class="bt-table">
            <thead><tr><th>Milestone</th><th>Project</th><th>Due Date</th><th>Status</th><th></th></tr></thead>
            <tbody>
              <tr *ngFor="let m of filtered">
                <td class="bt-strong">{{ m.milestoneName }}<div class="bt-muted">{{ m.description }}</div></td>
                <td>{{ m.projectName }}</td>
                <td class="bt-muted">{{ m.dueDate }}</td>
                <td><span class="bt-badge" [ngClass]="statusClass(m.status)">{{ m.status }}</span></td>
                <td>
                  <div class="bt-row-actions" *ngIf="m.status !== 'Completed'">
                    <button *ngIf="m.status === 'Pending'" class="bt-icon-btn" (click)="markInProgress(m)" title="Mark in progress">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                    </button>
                    <button class="bt-icon-btn" (click)="markComplete(m)" title="Mark complete">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="filtered.length === 0">
                <td colspan="5" class="bt-empty">No milestones match your filters.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
