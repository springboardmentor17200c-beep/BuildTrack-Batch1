<div class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 flex">
  <!-- Left Branding -->
  <div class="hidden lg:flex w-1/2 bg-slate-900 text-white p-16 flex-col justify-between">
    <div>
      <div class="flex items-center gap-4">
        <div
          class="h-14 w-14 rounded-2xl bg-blue-600 flex items-center justify-center text-2xl font-bold"
        >
          BT
        </div>

        <div>
          <h1 class="text-3xl font-bold">BuildTrack</h1>
          <p class="text-slate-300 mt-1">Construction Management Platform</p>
        </div>
      </div>
    </div>

    <div class="space-y-8">
      <div>
        <h2 class="text-4xl font-bold leading-tight">
          Build smarter.
          <br />
          Deliver faster.
        </h2>

        <p class="mt-6 text-slate-300 text-lg leading-8">
          Manage projects, workforce, inventory, clients and analytics from one unified platform.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div class="rounded-2xl bg-white/10 p-5">
          <p class="text-3xl font-bold">50+</p>
          <p class="text-slate-300 text-sm mt-1">Active Projects</p>
        </div>

        <div class="rounded-2xl bg-white/10 p-5">
          <p class="text-3xl font-bold">99%</p>
          <p class="text-slate-300 text-sm mt-1">Uptime</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Login -->
  <div class="flex flex-1 items-center justify-center px-6 py-12">
    <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl border border-slate-200 p-10">
      <div class="lg:hidden flex justify-center mb-8">
        <div
          class="h-16 w-16 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-2xl font-bold"
        >
          BT
        </div>
      </div>

      <h2 class="text-3xl font-bold text-slate-900">Welcome Back</h2>

      <p class="text-slate-500 mt-2">Sign in to continue to BuildTrack</p>

      <div
        *ngIf="error()"
        class="mt-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
      >
        {{ error() }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2"> Email </label>

          <input
            type="email"
            formControlName="email"
            placeholder="name@company.com"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2"> Password </label>

          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter password"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-14 outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100"
            />

            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-blue-600 hover:text-blue-700 font-medium"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <a routerLink="/reset-password" class="text-sm text-blue-600 hover:underline">
            Forgot Password?
          </a>
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-xl bg-blue-600 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ loading() ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>

      <div class="mt-8 border-t pt-6 space-y-3">
        <button
          routerLink="/register/company"
          class="w-full rounded-xl border border-blue-600 py-3 font-medium text-blue-600 hover:bg-blue-50 transition"
        >
          Register Company
        </button>

        <button
          routerLink="/register/employee"
          class="w-full rounded-xl border border-slate-300 py-3 font-medium text-slate-700 hover:bg-slate-100 transition"
        >
          Register Employee
        </button>
      </div>
    </div>
  </div>
</div>
