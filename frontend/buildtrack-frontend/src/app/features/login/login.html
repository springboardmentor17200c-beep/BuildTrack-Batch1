<div class="bt-auth-page">
  <div class="bt-auth-card">
    <a class="bt-auth-logo" [routerLink]="['/']" style="text-decoration:none;">
      <div class="bt-auth-logo-badge">BT</div>
      <span class="bt-auth-logo-text">BuildTrack</span>
    </a>

    <h1 class="bt-auth-title">{{ 'auth.welcomeBack' | translate }}</h1>
    <p class="bt-auth-subtitle">{{ 'auth.signInSubtitle' | translate }}</p>

    <div class="bt-auth-error" *ngIf="error">{{ error }}</div>

    <form class="bt-auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="bt-auth-field">
        <span>Email or Full Name</span>
        <input type="text" formControlName="username" placeholder="e.g. you@company.com" autocomplete="username" />
      </label>

      <label class="bt-auth-field">
        <span>{{ 'auth.password' | translate }}</span>
        <input type="password" formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
      </label>

      <div class="bt-auth-row">
        <span></span>
        <a class="bt-auth-link" [routerLink]="['/reset-password']">{{ 'auth.forgotPassword' | translate }}</a>
      </div>

      <button type="submit" class="bt-auth-submit" [disabled]="submitting">
        {{ (submitting ? 'auth.signingIn' : 'auth.signIn') | translate }}
      </button>
    </form>

    <div class="bt-auth-footer">
      {{ 'auth.noAccount' | translate }}
      <a class="bt-auth-link" [routerLink]="['/register']">{{ 'auth.createOne' | translate }}</a>
    </div>
  </div>
</div>
