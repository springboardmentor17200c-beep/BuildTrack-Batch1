<main class="project-details-page">
  <div class="page-toolbar">
    <button class="back-btn" type="button" (click)="goBack()">
      <span aria-hidden="true">←</span>
      Back to Projects
    </button>

    <p class="page-context">Construction Management / Project Details</p>
  </div>

  @if (error()) {
    <div class="error-state">
      <span class="error-icon">⚠️</span>
      <p class="error-message">{{ error() }}</p>
    </div>
  } @else if (projectData(); as data) {
    <app-header 
      [project]="derivedHeaderData()!" 
      (editProject)="openEditModal()" 
      (closeProject)="confirmCloseProject()">
    </app-header>

    <app-kpi-cards [kpiData]="data.kpiData"></app-kpi-cards>

    <section class="dashboard-grid overview-grid">
      <app-progress-overview [progressData]="derivedProgressData()!"></app-progress-overview>
      <app-budget-summary [budget]="data.budget"></app-budget-summary>
    </section>

    <app-milestones [milestones]="data.milestones"></app-milestones>

    <section class="dashboard-grid collaboration-grid">
      <app-activity-timeline [activities]="data.activities"></app-activity-timeline>
      <app-team-members [members]="data.teamMembers"></app-team-members>
    </section>
  }
</main>

@if (isEditModalOpen() && editingProject(); as editData) {
  <app-project-form 
    title="Edit Project"
    [initialData]="editData" 
    (save)="onProjectUpdate($event)" 
    (cancel)="closeEditModal()">
  </app-project-form>
}
