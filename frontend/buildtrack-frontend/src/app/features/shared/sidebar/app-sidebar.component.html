<aside class="bt-sidebar">
  <div class="bt-sidebar-logo">
    <div class="bt-auth-logo-badge">BT</div>
    <span class="bt-sidebar-logo-text">BuildTrack</span>
  </div>

  <nav class="bt-sidebar-nav">
    <a
      *ngFor="let item of navItems"
      class="bt-sidebar-link"
      [class.locked]="!isAllowed(item)"
      [routerLink]="[item.route]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">

      <span class="bt-sidebar-icon">
        <svg *ngIf="item.icon === 'dashboard'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><rect x="7" y="12" width="3" height="6"></rect><rect x="12" y="8" width="3" height="10"></rect><rect x="17" y="5" width="3" height="13"></rect></svg>
        <svg *ngIf="item.icon === 'resources'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <svg *ngIf="item.icon === 'inventory'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><rect x="7" y="12" width="3" height="6"></rect><rect x="12" y="8" width="3" height="10"></rect><rect x="17" y="5" width="3" height="13"></rect></svg>
        <svg *ngIf="item.icon === 'workforce'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"></circle><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path><circle cx="18" cy="8" r="2.5"></circle><path d="M22 21v-1.5a4 4 0 0 0-3-3.87"></path></svg>
        <svg *ngIf="item.icon === 'analytics'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15l3-4 3 3 5-7"></path></svg>
        <svg *ngIf="item.icon === 'profile'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a8 8 0 0 1 16 0v1"></path></svg>
      </span>

      <span class="bt-sidebar-label">{{ item.label }}</span>

      <svg *ngIf="!isAllowed(item)" class="bt-sidebar-lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </a>
  </nav>

  <div class="bt-sidebar-footer" *ngIf="currentUser">
    <div class="bt-sidebar-user">
      <div class="bt-stat-icon blue" style="width:34px;height:34px;">{{ currentUser.fullName.charAt(0) }}</div>
      <div>
        <div class="bt-sidebar-username">{{ currentUser.fullName }}</div>
        <div class="bt-sidebar-userrole">{{ currentUser.role }}</div>
      </div>
    </div>
    <button class="bt-sidebar-logout" (click)="logout()">Sign Out</button>
  </div>
</aside>
