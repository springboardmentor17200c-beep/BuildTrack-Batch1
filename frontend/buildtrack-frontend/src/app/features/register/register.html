<div class="bt-auth-page">
  <div class="bt-auth-card">
    <div class="bt-auth-logo">
      <div class="bt-auth-logo-badge">BT</div>
      <span class="bt-auth-logo-text">BuildTrack</span>
    </div>

    <h1 class="bt-auth-title">Create your account</h1>
    <p class="bt-auth-subtitle">Set up access to manage projects, sites, and teams.</p>

    <div class="bt-auth-error" *ngIf="error">{{ error }}</div>
    <div class="bt-auth-success" *ngIf="success">Account created! Redirecting to sign in...</div>

    <form class="bt-auth-form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
      <label class="bt-auth-field">
        <span>Username</span>
        <input type="text" formControlName="username" placeholder="e.g. priyamenon" autocomplete="username" />
      </label>

      <label class="bt-auth-field">
        <span>First Name</span>
        <input type="text" formControlName="firstName" placeholder="e.g. Priya" />
      </label>

      <label class="bt-auth-field">
        <span>Last Name</span>
        <input type="text" formControlName="lastName" placeholder="e.g. Menon" />
      </label>

      <label class="bt-auth-field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@company.com" autocomplete="email" />
      </label>

      <label class="bt-auth-field">
        <span>Phone Number</span>
        <input type="text" formControlName="phoneNumber" placeholder="+91 98765 43210" />
      </label>

      <label class="bt-auth-field">
        <span>Role</span>
        <select formControlName="role">
          <option value="" disabled selected>Select your role</option>
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </label>

      <ng-container *ngIf="showCompanyFields">
        <label class="bt-auth-field">
          <span>Company Name</span>
          <input type="text" formControlName="companyName" placeholder="e.g. Suresh Electricals" />
        </label>
        <label class="bt-auth-field">
          <span>Tax ID</span>
          <input type="text" formControlName="taxId" placeholder="GSTIN / Tax ID" />
        </label>
      </ng-container>

      <ng-container *ngIf="showEmployeeFields">
        <label class="bt-auth-field">
          <span>Employee ID</span>
          <input type="text" formControlName="employeeId" placeholder="e.g. EMP-1042" />
        </label>
        <label class="bt-auth-field">
          <span>Skills / Trade</span>
          <input type="text" formControlName="skillsOrTrade" placeholder="e.g. Electrician, Mason" />
        </label>
      </ng-container>

      <label class="bt-auth-field">
        <span>Password</span>
        <input type="password" formControlName="password" placeholder="At least 6 characters" autocomplete="new-password" />
      </label>

      <label class="bt-auth-field">
        <span>Confirm Password</span>
        <input type="password" formControlName="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
      </label>

      <button type="submit" class="bt-auth-submit" [disabled]="submitting">
        {{ submitting ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="bt-auth-footer">
      Already have an account?
      <a class="bt-auth-link" [routerLink]="['/login']">Sign in</a>
    </div>
  </div>
</div>
