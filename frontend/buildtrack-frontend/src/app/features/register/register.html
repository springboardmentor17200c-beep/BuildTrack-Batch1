<!-- =========================================================
     BUILDTRACK - REGISTER PAGE
     ========================================================= -->

<style>
  /* =========================================================
     PAGE
     ========================================================= */

  .bt-auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    background: #f5f7fb;
    box-sizing: border-box;
  }


  /* =========================================================
     CARD
     ========================================================= */

  .bt-auth-card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 14px;
    padding: 30px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }


  /* =========================================================
     TITLE
     ========================================================= */

  .bt-auth-title {
    margin: 0;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #1f2937;
  }

  .bt-auth-subtitle {
    margin: 8px 0 24px;
    text-align: center;
    font-size: 14px;
    color: #6b7280;
  }


  /* =========================================================
     FORM
     ========================================================= */

  .bt-auth-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }


  /* =========================================================
     FIELD
     ========================================================= */

  .bt-auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bt-auth-field span {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }


  /* =========================================================
     REQUIRED STAR
     ========================================================= */

  .bt-required {
    color: #dc2626;
    margin-left: 3px;
    font-weight: 700;
  }


  /* =========================================================
     INPUTS
     ========================================================= */

  .bt-auth-field input,
  .bt-auth-field select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: #ffffff;
    color: #1f2937;
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .bt-auth-field input::placeholder {
    color: #9ca3af;
  }

  .bt-auth-field input:focus,
  .bt-auth-field select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
  }


  /* =========================================================
     INVALID INPUT
     ========================================================= */

  .bt-auth-field input.ng-invalid.ng-touched,
  .bt-auth-field select.ng-invalid.ng-touched {
    border-color: #dc2626;
  }

  .bt-auth-field input.ng-invalid.ng-touched:focus,
  .bt-auth-field select.ng-invalid.ng-touched:focus {
    border-color: #dc2626;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
  }


  /* =========================================================
     VALID INPUT
     ========================================================= */

  .bt-auth-field input.ng-valid.ng-touched,
  .bt-auth-field select.ng-valid.ng-touched {
    border-color: #16a34a;
  }


  /* =========================================================
     VALIDATION MESSAGE
     ========================================================= */

  .bt-auth-validation {
    display: block;
    margin-top: 1px;
    font-size: 12px;
    line-height: 1.4;
    color: #dc2626;
  }


  /* =========================================================
     GENERAL ERROR
     ========================================================= */

  .bt-auth-error {
    margin-bottom: 16px;
    padding: 11px 13px;
    border: 1px solid #fecaca;
    border-radius: 7px;
    background: #fef2f2;
    color: #b91c1c;
    font-size: 13px;
    line-height: 1.4;
  }


  /* =========================================================
     SUCCESS MESSAGE
     ========================================================= */

  .bt-auth-success {
    margin-bottom: 16px;
    padding: 11px 13px;
    border: 1px solid #bbf7d0;
    border-radius: 7px;
    background: #f0fdf4;
    color: #15803d;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
  }


  /* =========================================================
     SUBMIT BUTTON
     ========================================================= */

  .bt-auth-submit {
    width: 100%;
    height: 44px;
    margin-top: 4px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition:
      background 0.2s ease,
      transform 0.1s ease;
  }

  .bt-auth-submit:hover:not(:disabled) {
    background: #1d4ed8;
  }

  .bt-auth-submit:active:not(:disabled) {
    transform: translateY(1px);
  }

  .bt-auth-submit:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }


  /* =========================================================
     FOOTER
     ========================================================= */

  .bt-auth-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: #6b7280;
  }

  .bt-auth-link {
    margin-left: 4px;
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
  }

  .bt-auth-link:hover {
    text-decoration: underline;
  }


  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 520px) {

    .bt-auth-page {
      padding: 20px 12px;
      align-items: flex-start;
    }

    .bt-auth-card {
      max-width: 480px;
      padding: 22px 18px;
      margin-top: 10px;
    }

    .bt-auth-title {
      font-size: 24px;
    }

    .bt-auth-subtitle {
      margin-bottom: 20px;
    }
  }


  /* =========================================================
     VERY SMALL SCREENS
     ========================================================= */

  @media (max-width: 400px) {

    .bt-auth-card {
      padding: 20px 14px;
    }

    .bt-name-grid {
      grid-template-columns: 1fr !important;
    }
  }
</style>


<!-- =========================================================
     REGISTER PAGE
     ========================================================= -->

<div class="bt-auth-page">

  <!-- =======================================================
       REGISTER CARD
       ======================================================= -->

  <div class="bt-auth-card">


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <h1 class="bt-auth-title">
      {{ 'auth.createAccount' | translate }}
    </h1>


    <!-- =====================================================
         SUBTITLE
         ===================================================== -->

    <p class="bt-auth-subtitle">
      {{ 'auth.registerSubtitle' | translate }}
    </p>


    <!-- =====================================================
         GENERAL ERROR MESSAGE
         ===================================================== -->

    <div
      class="bt-auth-error"
      *ngIf="error"
    >
      {{ error }}
    </div>


    <!-- =====================================================
         SUCCESS MESSAGE
         ===================================================== -->

    <div
      class="bt-auth-success"
      *ngIf="success"
    >
      {{ 'auth.accountCreated' | translate }}
    </div>


    <!-- =====================================================
         REGISTRATION FORM
         ===================================================== -->

    <form
      class="bt-auth-form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      *ngIf="!success"
    >


      <!-- ===================================================
           USERNAME - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.username' | translate }}
          <b class="bt-required">*</b>
        </span>

        <input
          type="text"
          formControlName="username"
          placeholder="e.g. priya.menon"
          autocomplete="username"
        />

        <small
          class="bt-auth-validation"
          *ngIf="isInvalid('username')"
        >
          {{ getErrorMessage('username') }}
        </small>

      </label>


      <!-- ===================================================
           FIRST NAME + LAST NAME
           =================================================== -->

      <div
        class="bt-name-grid"
        style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:12px;
        "
      >


        <!-- =================================================
             FIRST NAME - MANDATORY
             ================================================= -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.firstName' | translate }}
            <b class="bt-required">*</b>
          </span>

          <input
            type="text"
            formControlName="firstName"
            placeholder="Priya"
            autocomplete="given-name"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('firstName')"
          >
            {{ getErrorMessage('firstName') }}
          </small>

        </label>


        <!-- =================================================
             LAST NAME - OPTIONAL
             ================================================= -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.lastName' | translate }}
          </span>

          <input
            type="text"
            formControlName="lastName"
            placeholder="Menon"
            autocomplete="family-name"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('lastName')"
          >
            {{ getErrorMessage('lastName') }}
          </small>

        </label>

      </div>


      <!-- ===================================================
           EMAIL - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.email' | translate }}
          <b class="bt-required">*</b>
        </span>

        <input
          type="email"
          formControlName="email"
          placeholder="you@company.com"
          autocomplete="email"
        />

        <small
          class="bt-auth-validation"
          *ngIf="isInvalid('email')"
        >
          {{ getErrorMessage('email') }}
        </small>

      </label>


      <!-- ===================================================
           PHONE NUMBER - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.phoneNumber' | translate }}
          <b class="bt-required">*</b>
        </span>

        <input
          type="text"
          formControlName="phoneNumber"
          placeholder="+91 98765 43210"
          autocomplete="tel"
        />

        <small
          class="bt-auth-validation"
          *ngIf="isInvalid('phoneNumber')"
        >
          {{ getErrorMessage('phoneNumber') }}
        </small>

      </label>


      <!-- ===================================================
           ROLE - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.role' | translate }}
          <b class="bt-required">*</b>
        </span>

        <select formControlName="role">

          <option
            value=""
            disabled
          >
            {{ 'auth.selectRole' | translate }}
          </option>

          <option
            *ngFor="let r of roles"
            [value]="r"
          >
            {{ r }}
          </option>

        </select>

        <small
          class="bt-auth-validation"
          *ngIf="isInvalid('role')"
        >
          {{ getErrorMessage('role') }}
        </small>

      </label>


      <!-- ===================================================
           COMPANY FIELDS
           
           Contractor
           Client / Owner
           =================================================== -->

      <ng-container *ngIf="showCompanyFields">


        <!-- COMPANY NAME - MANDATORY -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.companyName' | translate }}
            <b class="bt-required">*</b>
          </span>

          <input
            type="text"
            formControlName="companyName"
            placeholder="e.g. Suresh Electricals"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('companyName')"
          >
            {{ getErrorMessage('companyName') }}
          </small>

        </label>


        <!-- TAX ID - MANDATORY -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.taxId' | translate }}
            <b class="bt-required">*</b>
          </span>

          <input
            type="text"
            formControlName="taxId"
            placeholder="GSTIN / Tax ID"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('taxId')"
          >
            {{ getErrorMessage('taxId') }}
          </small>

        </label>

      </ng-container>


      <!-- ===================================================
           EMPLOYEE FIELDS
           
           Worker
           Site Engineer
           =================================================== -->

      <ng-container *ngIf="showEmployeeFields">


        <!-- EMPLOYEE ID - MANDATORY -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.employeeId' | translate }}
            <b class="bt-required">*</b>
          </span>

          <input
            type="text"
            formControlName="employeeId"
            placeholder="e.g. EMP-1042"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('employeeId')"
          >
            {{ getErrorMessage('employeeId') }}
          </small>

        </label>


        <!-- SKILLS / TRADE - MANDATORY -->

        <label class="bt-auth-field">

          <span>
            {{ 'auth.skillsOrTrade' | translate }}
            <b class="bt-required">*</b>
          </span>

          <input
            type="text"
            formControlName="skillsOrTrade"
            placeholder="e.g. Electrician, Mason"
          />

          <small
            class="bt-auth-validation"
            *ngIf="isInvalid('skillsOrTrade')"
          >
            {{ getErrorMessage('skillsOrTrade') }}
          </small>

        </label>

      </ng-container>


      <!-- ===================================================
           PASSWORD - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.password' | translate }}
          <b class="bt-required">*</b>
        </span>

        <input
          type="password"
          formControlName="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        />

        <small
          class="bt-auth-validation"
          *ngIf="isInvalid('password')"
        >
          {{ getErrorMessage('password') }}
        </small>

      </label>


      <!-- ===================================================
           CONFIRM PASSWORD - MANDATORY
           =================================================== -->

      <label class="bt-auth-field">

        <span>
          {{ 'auth.confirmPassword' | translate }}
          <b class="bt-required">*</b>
        </span>

        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
        />

        <!-- Required message -->

        <small
          class="bt-auth-validation"
          *ngIf="
            isInvalid('confirmPassword') &&
            !form.errors?.['mismatch']
          "
        >
          {{ getErrorMessage('confirmPassword') }}
        </small>


        <!-- Password mismatch -->

        <small
          class="bt-auth-validation"
          *ngIf="
            form.errors?.['mismatch'] &&
            form.get('confirmPassword')?.touched
          "
        >
          Passwords do not match.
        </small>

      </label>


      <!-- ===================================================
           CREATE ACCOUNT BUTTON
           =================================================== -->

      <button
        type="submit"
        class="bt-auth-submit"
        [disabled]="submitting"
      >

        {{
          (
            submitting
              ? 'auth.creatingAccount'
              : 'auth.createAccountBtn'
          ) | translate
        }}

      </button>


    </form>


    <!-- =====================================================
         LOGIN FOOTER
         ===================================================== -->

    <div class="bt-auth-footer">

      {{ 'auth.alreadyHaveAccount' | translate }}

      <a
        class="bt-auth-link"
        [routerLink]="['/login']"
      >
        {{ 'auth.signInLink' | translate }}
      </a>

    </div>


  </div>

</div>
