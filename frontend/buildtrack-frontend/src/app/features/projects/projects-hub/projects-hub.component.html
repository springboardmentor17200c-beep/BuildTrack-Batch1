<div class="bt-page">
      <div class="bt-topbar">
        <div>
          <h1 class="bt-title">Project Management</h1>
          <p class="bt-subtitle">Create, track, and monitor every project from planning through closure.</p>
        </div>
      </div>

      <div class="bt-option-grid">
        <button
          class="bt-option-card"
          *ngFor="let opt of options"
          (click)="open(opt.route)"
          [routerLink]="['/projects', opt.route]">

          <div class="bt-stat-icon" [ngClass]="opt.accent" style="width:44px;height:44px;">
            <svg *ngIf="opt.icon === 'listing'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="4" rx="1"></rect><rect x="3" y="10" width="18" height="4" rx="1"></rect><rect x="3" y="16" width="18" height="4" rx="1"></rect>
            </svg>
            <svg *ngIf="opt.icon === 'milestones'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 21V4"></path><path d="M4 5h13l-2 4 2 4H4"></path>
            </svg>
            <svg *ngIf="opt.icon === 'status'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"></path><path d="M7 15l3-4 3 3 5-7"></path>
            </svg>
          </div>

          <div class="bt-option-body">
            <h3>{{ opt.title }}</h3>
            <p>{{ opt.description }}</p>
          </div>

          <div class="bt-option-footer">
            <div class="bt-stat-text">
              <span class="bt-stat-value" style="font-size:16px;">{{ opt.stat }}</span>
              <span class="bt-stat-sub">{{ opt.statLabel }}</span>
            </div>
            <span class="bt-option-arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>
              </svg>
            </span>
          </div>
        </button>
      </div>

      <div class="bt-panel">
        <div class="bt-panel-header">
          <div>
            <h3 class="bt-panel-title">Portfolio Overview</h3>
            <span class="bt-panel-sub">Current status across all projects</span>
          </div>
        </div>
        <div class="bt-stats-row" style="margin-bottom:0;">
          <div class="bt-stat-card">
            <div class="bt-stat-icon blue">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15l3-4 3 3 5-7"></path></svg>
            </div>
            <div class="bt-stat-text">
              <span class="bt-stat-value">{{ totalProjects }}</span>
              <span class="bt-stat-label">Total Projects</span>
            </div>
          </div>
          <div class="bt-stat-card">
            <div class="bt-stat-icon blue">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"></path><circle cx="12" cy="12" r="9"></circle></svg>
            </div>
            <div class="bt-stat-text">
              <span class="bt-stat-value">{{ inProgressCount }}</span>
              <span class="bt-stat-label">In Progress</span>
            </div>
          </div>
          <div class="bt-stat-card">
            <div class="bt-stat-icon orange">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6"></path></svg>
            </div>
            <div class="bt-stat-text">
              <span class="bt-stat-value">{{ onHoldCount }}</span>
              <span class="bt-stat-label">On Hold</span>
            </div>
          </div>
          <div class="bt-stat-card">
            <div class="bt-stat-icon green">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
            </div>
            <div class="bt-stat-text">
              <span class="bt-stat-value">{{ completedCount }}</span>
              <span class="bt-stat-label">Completed</span>
            </div>
          </div>
        </div>
      </div>
    </div>
